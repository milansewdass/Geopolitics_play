{% extends "base.html" %}
{% set active = 'hq' %}
{% block title %}New campaign · GEOPOLITICS{% endblock %}
{% block content %}
<div class="eyebrow">New campaign</div>
<h1>Choose your nation</h1>
<div class="split">
  <section class="card">
    <label for="q">Search countries</label>
    <input id="q" type="search" placeholder="Type a country name…" autocomplete="off">
    <div id="clist" class="clist" role="listbox" aria-label="Countries"><div class="skeleton">Loading countries…</div></div>
  </section>
  <section class="card" id="detail" aria-live="polite">
    <div class="skeleton">Select a country to see its starting strength.</div>
  </section>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/new.js') }}"></script>{% endblock %}
